# Giữ nguyên đường dẫn API hiện có của backend (/auth, /password, /users, /health)
# thay vì thêm tiền tố /api — để không phải sửa code backend/frontend đã viết.

server {
    listen 80;
    server_name test.hawee.com.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.hawee.com.vn;

    ssl_certificate     /etc/nginx/certs/server.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 10m;

    # Re-resolve IP của service "be" mỗi request (quan trọng khi CI/CD recreate container).
    resolver 127.0.0.11 valid=10s;
    set $upstream_be be;

    location /health {
        proxy_pass http://$upstream_be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://$upstream_be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /password {
        proxy_pass http://$upstream_be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (danh sách user realtime) — phải tắt buffering, không thì client không nhận
    # được sự kiện cho tới khi Nginx gom đủ buffer hoặc connection đóng.
    location /users/stream {
        proxy_pass http://$upstream_be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /users {
        proxy_pass http://$upstream_be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
