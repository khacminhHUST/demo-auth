name: Rollback demo-auth
on:
  workflow_dispatch:
    inputs:
      tag:    { description: "Tag cần quay về (7 ký tự SHA)", required: true,  type: string }
      reason: { description: "Lý do (ghi log)",              required: false, type: string }
concurrency:
  group: deploy-demo-auth          # GIỐNG deploy.yml → không chạy chồng
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: self-hosted
    steps:
      - name: Quay lui về ${{ github.event.inputs.tag }}
        working-directory: /opt/demo-auth
        run: |
          echo "Rollback → '${{ github.event.inputs.tag }}' — lý do: ${{ github.event.inputs.reason }}"
          ./rollback.sh "${{ github.event.inputs.tag }}"
