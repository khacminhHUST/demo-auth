name: Deploy demo-auth

on:
  push:
    branches: [main]

concurrency:
  group: deploy-demo-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Toàn bộ repo là project dir (không có thư mục con <ProjectDir> riêng).
      - name: Đồng bộ code vào /opt/demo-auth
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='certs/' \
            --exclude='shared/' \
            --exclude='docker-compose.override.yml' \
            "$GITHUB_WORKSPACE/" /opt/demo-auth/

      - name: Build (tag SHA) & khởi động
        working-directory: /opt/demo-auth
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          ./scripts-deploy/write-override.sh "$TAG"
          docker compose up -d --build
          docker compose ps
          mkdir -p shared
          printf '%s  %s  %s\n' "$(date -Iseconds)" "$TAG" "$GITHUB_SHA" >> shared/releases.log
          echo "$TAG" > shared/CURRENT_TAG

      - name: Giữ 5 bản, dọn phần cũ
        run: |
          for repo in demo-auth_be demo-auth_fe; do
            docker images "$repo" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':<none>$' | awk 'NR>5' | xargs -r docker rmi -f 2>/dev/null || true
          done
          docker image prune -f
