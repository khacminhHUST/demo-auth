name: CI - Test
on: [push, pull_request]

jobs:
  # Chạy trên cloud runner miễn phí, không đụng server. Chặn sớm nếu repo "bẩn".
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts-dev/check_repo.sh .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm ci + build
        working-directory: fe
        run: npm ci && npm run build

# Chưa có backend-test job: dự án chưa có bộ test (requirements-dev.txt/pytest).
# Thêm sau khi có test suite thật, theo đúng mẫu ở HUONG_DAN_CICD.md mục 8.
